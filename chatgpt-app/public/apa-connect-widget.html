<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APA Connect</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --green: #2d6a4f;
        --green-dark: #1b4332;
        --green-soft: #d8f3dc;
        --cream: #f7f8f4;
        --surface: light-dark(#ffffff, #161a18);
        --surface-soft: light-dark(#f5f7f4, #202622);
        --text: light-dark(#162019, #f1f5f2);
        --muted: light-dark(#5f6c63, #aeb9b1);
        --border: light-dark(#dce4de, #39443c);
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        color: var(--text);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 14px;
      }

      .shell {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 12px 32px rgb(20 48 33 / 8%);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        background:
          radial-gradient(circle at 95% 0%, rgb(255 255 255 / 28%), transparent 38%),
          linear-gradient(135deg, var(--green-dark), var(--green));
        color: #fff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .logo {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: 15px;
        background: rgb(255 255 255 / 15%);
        font-size: 22px;
      }

      .brand h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.1;
      }

      .brand p {
        margin: 4px 0 0;
        color: rgb(255 255 255 / 82%);
        font-size: 12px;
      }

      .site-button {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 999px;
        background: rgb(255 255 255 / 12%);
        padding: 8px 11px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .content {
        padding: 20px;
      }

      .hero {
        display: grid;
        gap: 14px;
      }

      .hero h2,
      .section-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.22;
      }

      .hero p,
      .summary {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .quick-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 4px;
      }

      .quick-card {
        display: flex;
        min-height: 112px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface-soft);
        padding: 15px;
        color: var(--text);
        text-align: left;
        transition: transform 120ms ease, border-color 120ms ease;
      }

      .quick-card:hover {
        transform: translateY(-1px);
        border-color: var(--green);
      }

      .quick-card span:first-child {
        font-size: 25px;
      }

      .quick-card strong {
        display: block;
        font-size: 14px;
      }

      .quick-card small {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .results-header {
        display: grid;
        gap: 6px;
        margin-bottom: 15px;
      }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        padding: 15px;
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .card h3 {
        margin: 0;
        font-size: 17px;
        line-height: 1.25;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .description {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--surface-soft);
        padding: 5px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .badge.green {
        background: light-dark(var(--green-soft), #274b37);
        color: light-dark(var(--green-dark), #c9f2d6);
      }

      .details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 13px;
      }

      .detail {
        border-radius: 12px;
        background: var(--surface-soft);
        padding: 9px 10px;
      }

      .detail span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .detail strong {
        display: block;
        margin-top: 3px;
        font-size: 13px;
      }

      .primary-button,
      .secondary-button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        padding: 9px 13px;
        font-weight: 800;
      }

      .primary-button {
        border: 0;
        background: var(--green);
        color: #fff;
      }

      .primary-button:hover {
        background: var(--green-dark);
      }

      .secondary-button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }

      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .inline-form {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        border-top: 1px solid var(--border);
        padding-top: 14px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .field {
        display: grid;
        gap: 5px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface);
        padding: 10px 11px;
        color: var(--text);
        outline: none;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgb(45 106 79 / 12%);
      }

      .field textarea {
        min-height: 70px;
        resize: vertical;
      }

      .form-actions {
        display: flex;
        gap: 8px;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 160px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 20;
        max-width: 540px;
        margin: 0 auto;
        border-radius: 14px;
        background: var(--green-dark);
        padding: 12px 14px;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 12px 30px rgb(0 0 0 / 20%);
      }

      .toast.error {
        background: var(--danger);
      }

      .loading {
        opacity: 0.65;
        pointer-events: none;
      }

      @media (max-width: 560px) {
        .app {
          padding: 8px;
        }

        .header,
        .content {
          padding: 16px;
        }

        .quick-actions,
        .form-grid,
        .details {
          grid-template-columns: 1fr;
        }

        .site-button {
          padding: 8px;
        }

        .site-button span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="shell">
        <header class="header">
          <div class="brand">
            <div class="logo" aria-hidden="true">🌿</div>
            <div>
              <h1>APA Connect</h1>
              <p>Activité physique adaptée, près de chez vous</p>
            </div>
          </div>
          <button id="site-button" class="site-button" type="button">
            ↗ <span>Voir le site</span>
          </button>
        </header>
        <div id="content" class="content" aria-live="polite"></div>
      </section>
    </main>
    <div id="toast" hidden></div>

    <script>
      const content = document.getElementById("content");
      const siteButton = document.getElementById("site-button");
      const toast = document.getElementById("toast");
      let currentData = null;
      let activeSiteUrl = "";
      let rpcCounter = 0;
      const pendingRpc = new Map();

      const categoryLabels = {
        cours_sur_chaise: "Cours sur chaise",
        mobilite_douce: "Mobilité douce",
        prevention_chutes: "Prévention des chutes",
        renforcement_doux: "Renforcement doux",
        respiration_relaxation: "Respiration et relaxation",
        equilibre: "Équilibre",
        autre: "Autre",
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(value) {
        if (!value) return "À préciser";
        const date = new Date(`${value}T12:00:00`);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("fr-FR", {
          weekday: "short",
          day: "numeric",
          month: "short",
        }).format(date);
      }

      function formatPrice(value) {
        const price = Number(value || 0);
        if (!price) return "Gratuit";
        return new Intl.NumberFormat("fr-FR", {
          style: "currency",
          currency: "EUR",
        }).format(price);
      }

      function showToast(message, isError = false) {
        toast.textContent = message;
        toast.className = `toast${isError ? " error" : ""}`;
        toast.hidden = false;
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          toast.hidden = true;
        }, 4500);
      }

      function rpcRequest(method, params) {
        const id = `apa-${Date.now()}-${++rpcCounter}`;
        return new Promise((resolve, reject) => {
          const timer = window.setTimeout(() => {
            pendingRpc.delete(id);
            reject(new Error("La demande a expiré."));
          }, 20000);
          pendingRpc.set(id, { resolve, reject, timer });
          window.parent.postMessage(
            { jsonrpc: "2.0", id, method, params },
            "*",
          );
        });
      }

      async function callTool(name, args) {
        if (window.openai?.callTool) {
          return window.openai.callTool(name, args);
        }
        return rpcRequest("tools/call", { name, arguments: args });
      }

      function sendMessage(text) {
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method: "ui/message",
            params: {
              role: "user",
              content: [{ type: "text", text }],
            },
          },
          "*",
        );
      }

      function actionError(result) {
        if (!result) return "Réponse vide du serveur.";
        if (result.structuredContent?.success === false) {
          return result.structuredContent.message || "La demande a échoué.";
        }
        if (result.isError) {
          const text = Array.isArray(result.content)
            ? result.content.map((part) => part.text || "").join(" ")
            : "";
          return text || "La demande a échoué.";
        }
        return "";
      }

      function renderHome(data) {
        content.innerHTML = `
          <div class="hero">
            <div>
              <h2>${escapeHtml(data.title || "APA Connect")}</h2>
              <p>${escapeHtml(data.summary || "Trouvez un accompagnement adapté près de chez vous.")}</p>
            </div>
            <div class="quick-actions">
              <button class="quick-card" data-message="Trouve-moi un intervenant en activité physique adaptée près de chez moi.">
                <span>🧑‍⚕️</span>
                <span>
                  <strong>Trouver un intervenant</strong>
                  <small>Disponibilités, domicile et diplôme vérifié</small>
                </span>
              </button>
              <button class="quick-card" data-message="Trouve-moi un cours sur chaise ou un cours d'activité physique adaptée près de chez moi.">
                <span>🪑</span>
                <span>
                  <strong>Trouver un cours</strong>
                  <small>Cours sur chaise, mobilité et prévention des chutes</small>
                </span>
              </button>
            </div>
          </div>
        `;
      }

      function intervenantBadges(item) {
        const badges = [];
        if (item.verified) badges.push('<span class="badge green">✓ Diplôme vérifié</span>');
        if (item.availableToday) badges.push('<span class="badge green">Disponible aujourd’hui</span>');
        else if (item.availableThisWeek) badges.push('<span class="badge">Disponible cette semaine</span>');
        if (item.homeVisit) badges.push('<span class="badge">🏠 À domicile</span>');
        return badges.join("");
      }

      function renderIntervenant(item) {
        const publics = (item.publics || []).slice(0, 4);
        const places = (item.places || []).slice(0, 4);
        return `
          <article class="card" data-card-id="${escapeHtml(item.id)}">
            <div class="card-top">
              <div>
                <h3>${escapeHtml(item.title)}</h3>
                <p class="subtitle">${escapeHtml([item.city, item.subtitle].filter(Boolean).join(" · "))}</p>
              </div>
              <span aria-hidden="true">🌱</span>
            </div>
            ${item.description ? `<p class="description">${escapeHtml(item.description)}</p>` : ""}
            <div class="badges">
              ${intervenantBadges(item)}
              ${publics.map((value) => `<span class="badge">${escapeHtml(value.replaceAll("_", " "))}</span>`).join("")}
              ${places.map((value) => `<span class="badge">${escapeHtml(value.replaceAll("_", " "))}</span>`).join("")}
            </div>
            <div class="card-actions">
              <button class="primary-button action-button" type="button" data-action="callback" data-id="${escapeHtml(item.id)}">Demander un rappel</button>
            </div>
            <div class="form-slot"></div>
          </article>
        `;
      }

      function renderClass(item) {
        return `
          <article class="card" data-card-id="${escapeHtml(item.id)}">
            <div class="card-top">
              <div>
                <h3>${escapeHtml(item.title)}</h3>
                <p class="subtitle">${escapeHtml([item.city, item.subtitle].filter(Boolean).join(" · "))}</p>
              </div>
              <span aria-hidden="true">${item.adaptedChairClass ? "🪑" : "🤸"}</span>
            </div>
            ${item.description ? `<p class="description">${escapeHtml(item.description)}</p>` : ""}
            <div class="badges">
              ${item.adaptedChairClass ? '<span class="badge green">Adapté sur chaise</span>' : ""}
              ${item.category ? `<span class="badge">${escapeHtml(categoryLabels[item.category] || item.category)}</span>` : ""}
            </div>
            <div class="details">
              <div class="detail"><span>Date</span><strong>${escapeHtml(formatDate(item.date))}${item.startTime ? ` à ${escapeHtml(item.startTime)}` : ""}</strong></div>
              <div class="detail"><span>Durée</span><strong>${escapeHtml(item.durationMinutes || 60)} min</strong></div>
              <div class="detail"><span>Tarif</span><strong>${escapeHtml(formatPrice(item.price))}</strong></div>
              <div class="detail"><span>Places restantes</span><strong>${escapeHtml(item.placesLeft ?? "À confirmer")}</strong></div>
            </div>
            <div class="card-actions">
              <button class="primary-button action-button" type="button" data-action="book" data-id="${escapeHtml(item.id)}" ${Number(item.placesLeft) === 0 ? "disabled" : ""}>${Number(item.placesLeft) === 0 ? "Cours complet" : "Réserver"}</button>
            </div>
            <div class="form-slot"></div>
          </article>
        `;
      }

      function renderResults(data) {
        const items = Array.isArray(data.items) ? data.items : [];
        content.innerHTML = `
          <div class="results-header">
            <h2 class="section-title">${escapeHtml(data.title || "Résultats")}</h2>
            <p class="summary">${escapeHtml(data.summary || "")}</p>
          </div>
          <div class="cards">
            ${items.length ? items.map((item) => item.itemType === "class" ? renderClass(item) : renderIntervenant(item)).join("") : '<div class="empty">Aucun résultat pour le moment. Demandez à ChatGPT d’élargir la ville ou les critères.</div>'}
          </div>
        `;
      }

      function render(data) {
        if (!data) {
          renderHome({
            title: "APA Connect",
            summary: "Demandez à ChatGPT de trouver un intervenant ou un cours adapté.",
          });
          return;
        }
        currentData = data;
        activeSiteUrl = /^https?:\/\//.test(data.siteUrl || "") ? data.siteUrl : "";
        siteButton.style.display = activeSiteUrl ? "inline-flex" : "none";
        if (data.kind === "home") renderHome(data);
        else if (data.kind === "intervenants" || data.kind === "classes") renderResults(data);
        else if (data.kind === "action") showToast(data.message || "Action réalisée.", !data.success);
      }

      function closeOtherForms(exceptCard) {
        document.querySelectorAll(".card").forEach((card) => {
          if (card !== exceptCard) {
            const slot = card.querySelector(".form-slot");
            if (slot) slot.innerHTML = "";
          }
        });
      }

      function callbackForm(item) {
        return `
          <form class="inline-form" data-form="callback" data-id="${escapeHtml(item.id)}">
            <div class="form-grid">
              <div class="field"><label>Prénom *</label><input name="first_name" required autocomplete="given-name" /></div>
              <div class="field"><label>Ville</label><input name="city" value="${escapeHtml(item.city || "")}" autocomplete="address-level2" /></div>
              <div class="field"><label>Téléphone</label><input name="phone" autocomplete="tel" /></div>
              <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" /></div>
              <div class="field full"><label>Votre besoin *</label><input name="need" required value="Activité physique adaptée" /></div>
              <div class="field full"><label>Message</label><textarea name="message" placeholder="Précisez vos disponibilités ou votre situation."></textarea></div>
            </div>
            <div class="form-actions">
              <button class="primary-button" type="submit">Envoyer la demande</button>
              <button class="secondary-button cancel-form" type="button">Annuler</button>
            </div>
          </form>
        `;
      }

      function bookingForm(item) {
        return `
          <form class="inline-form" data-form="book" data-id="${escapeHtml(item.id)}">
            <div class="form-grid">
              <div class="field full"><label>Nom et prénom *</label><input name="name" required autocomplete="name" /></div>
              <div class="field"><label>Téléphone</label><input name="phone" autocomplete="tel" /></div>
              <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" /></div>
            </div>
            <div class="form-actions">
              <button class="primary-button" type="submit">Confirmer la réservation</button>
              <button class="secondary-button cancel-form" type="button">Annuler</button>
            </div>
          </form>
        `;
      }

      content.addEventListener("click", (event) => {
        const quick = event.target.closest("[data-message]");
        if (quick) {
          sendMessage(quick.dataset.message);
          return;
        }

        const cancel = event.target.closest(".cancel-form");
        if (cancel) {
          const slot = cancel.closest(".form-slot");
          if (slot) slot.innerHTML = "";
          return;
        }

        const button = event.target.closest(".action-button");
        if (!button || button.disabled) return;
        const card = button.closest(".card");
        const slot = card?.querySelector(".form-slot");
        const item = currentData?.items?.find((candidate) => candidate.id === button.dataset.id);
        if (!card || !slot || !item) return;
        closeOtherForms(card);
        slot.innerHTML = button.dataset.action === "book" ? bookingForm(item) : callbackForm(item);
        slot.querySelector("input")?.focus();
      });

      content.addEventListener("submit", async (event) => {
        const form = event.target.closest(".inline-form");
        if (!form) return;
        event.preventDefault();
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        form.classList.add("loading");
        const values = Object.fromEntries(new FormData(form).entries());

        try {
          let result;
          if (form.dataset.form === "book") {
            if (!values.phone && !values.email) {
              throw new Error("Indiquez un téléphone ou un email.");
            }
            result = await callTool("book_class", {
              class_id: form.dataset.id,
              name: values.name,
              phone: values.phone || undefined,
              email: values.email || undefined,
            });
          } else {
            if (!values.phone && !values.email) {
              throw new Error("Indiquez un téléphone ou un email.");
            }
            result = await callTool("request_callback", {
              intervenant_id: form.dataset.id,
              first_name: values.first_name,
              phone: values.phone || undefined,
              email: values.email || undefined,
              city: values.city || undefined,
              need: values.need,
              message: values.message || undefined,
            });
          }

          const error = actionError(result);
          if (error) throw new Error(error);
          showToast(result?.structuredContent?.message || "Votre demande a bien été envoyée.");
          form.innerHTML = '<div class="badge green">✓ Demande enregistrée</div>';
        } catch (error) {
          showToast(error?.message || "La demande a échoué.", true);
          submitButton.disabled = false;
          form.classList.remove("loading");
        }
      });

      siteButton.addEventListener("click", () => {
        if (!activeSiteUrl) return;
        if (window.openai?.openExternal) {
          window.openai.openExternal(activeSiteUrl);
        } else {
          window.open(activeSiteUrl, "_blank", "noopener,noreferrer");
        }
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id && pendingRpc.has(message.id)) {
          const pending = pendingRpc.get(message.id);
          pendingRpc.delete(message.id);
          window.clearTimeout(pending.timer);
          if (message.error) pending.reject(new Error(message.error.message || "Erreur RPC"));
          else pending.resolve(message.result);
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          render(message.params?.structuredContent);
        }
      }, { passive: true });

      window.addEventListener("openai:set_globals", (event) => {
        render(event.detail?.globals?.toolOutput || window.openai?.toolOutput);
      }, { passive: true });

      render(window.openai?.toolOutput);
    </script>
  </body>
</html>
