services:
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: apa_connect_dev
      POSTGRES_USER: apa_connect
      POSTGRES_PASSWORD: local-only
    volumes:
      - apa_connect_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - apa_connect_mongo:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  apa_connect_mongo:
  apa_connect_postgres:
